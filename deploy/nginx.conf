server {
    listen 80;
    root /usr/share/nginx/html;
    absolute_redirect off;

    location = /assistant {
        return 301 /assistant/;
    }

    location /assistant/ {
        try_files $uri $uri/ /assistant/index.html;
    }

    location = /healthz {
        access_log off;
        return 200 "ok";
    }
}
